<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n-title-text="extName">Host Groups</title><link rel="stylesheet" href="styles.css"><script type="module" src="popup.js"></script></head>
<body class="popup-body">
  <main class="popup">
    <header class="popup-header"><span class="brand"><img src="icons/48.png" width="32" height="32" alt=""><span data-i18n="extName">Host Groups</span></span><span id="version" class="count"></span></header>
    <p class="popup-description" data-i18n="popupTagline"></p>
    <div class="popup-toggle"><div><strong id="state" data-i18n="popupLoading"></strong><p id="rule-summary"></p></div><label class="switch"><input id="enabled" type="checkbox" data-i18n-aria="automationAria"><span class="switch-track"></span></label></div>
    <div id="active-host" class="popup-host"></div>
    <p id="status" class="field-help" role="status" aria-live="polite"></p>
    <button id="options" class="button primary full" data-i18n="popupManage"></button><button id="apply" class="button secondary full" data-i18n="popupApply"></button>
    <p class="popup-footnote" data-i18n="popupFootnote"></p>
    <p class="popup-footnote"><a id="credit" href="https://github.com/alesiestu/tab-by-host" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a></p>
  </main>
</body></html>
